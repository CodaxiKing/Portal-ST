<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Shop Titans</title>
  <meta name="description" content="Banco de dados e ferramentas do Shop Titans: itens, campeões, classes, missões, baús, talentos e calculadoras.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=111">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#101012">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta property="og:title" content="Portal Shop Titans">
  <meta property="og:description" content="Banco de dados e ferramentas do Shop Titans, extraídos dos arquivos do jogo.">
  <meta property="og:image" content="og/default.jpg">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><i class="ic ic-menu"></i></button>
      <a class="brand" href="#/">
        <img class="brand-logo" src="img/brand/logo-sm.webp" alt="Portal ST" width="72" height="48">
        <span>Portal <b>Shop Titans</b></span>
      </a>
      <div class="top-actions">
        <span class="ver-pill" id="verPill" hidden><span class="pulse"></span><span id="verTxt"></span></span>
        <a class="support-btn" id="supportBtn" href="#/apoiar"><i class="ic ic-heart"></i><span class="sp-txt">Apoiar</span></a>
        <button class="search-btn" id="searchBtn" aria-label="Buscar"><i class="ic ic-search"></i><span class="sb-txt">Buscar</span><kbd>Ctrl K</kbd></button>
        <select class="lang-sel" id="langSel" aria-label="Idioma"></select>
        <button class="icon-btn" id="themeBtn" aria-label="Tema"><i class="ic ic-moon theme-ic-light"></i><i class="ic ic-sun theme-ic-dark"></i></button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav" id="nav" aria-label="Seções"></nav>
    <main class="content" id="view"></main>
  </div>

  <div class="drawer-backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog">
    <button class="icon-btn close" id="closeBtn" aria-label="Fechar"><i class="ic ic-close"></i></button>
    <div id="detail"></div>
  </aside>

  <footer class="foot" id="foot"></footer>

  <script src="assets/st-pure.js?v=111"></script>
  <script src="assets/core.js?v=111"></script>
  <script src="assets/i18n.js?v=111"></script>
  <script src="assets/pages/home.js?v=111"></script>
  <script src="assets/pages/items.js?v=111"></script>
  <script src="assets/pages/notes.js?v=111"></script>
  <script src="assets/pages/db.js?v=111"></script>
  <script src="assets/pages/tools.js?v=111"></script>
  <script src="assets/pages/tools2.js?v=111"></script>
  <script src="assets/pages/hypermax.js?v=111"></script>
  <script src="assets/pages/builder.js?v=111"></script>
  <script src="assets/pages/tools3.js?v=111"></script>
  <script src="assets/pages/events.js?v=111"></script>
  <script src="assets/pages/calendar.js?v=111"></script>
  <script src="assets/pages/events2.js?v=111"></script>
  <script src="assets/pages/extras.js?v=111"></script>
  <script src="assets/pages/account.js?v=111"></script>
  <script src="assets/pages/sell.js?v=111"></script>
  <script src="assets/pages/fusion.js?v=111"></script>
  <script src="assets/pages/support.js?v=111"></script>
  <script src="assets/search.js?v=111"></script>
  <script>
    ST.start();
    // app instalável e cache offline (só funciona servido por http/https)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
